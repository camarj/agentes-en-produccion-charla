# Construye la imagen de la demo en Cloud Build y la guarda en Artifact Registry.
# Uso: gcloud builds submit --config cloudbuild.yaml --substitutions=_TAG=<sha>
# NEXT_PUBLIC_GOOGLE_CLIENT_ID se incrusta en el bundle del navegador (no es secreto).
# _PRESENTACION elige las partes de la charla (lib/tramos.ts): espol (por defecto)
# o devfest. Para el DevFest: --substitutions=_TAG=<sha>,_PRESENTACION=devfest
substitutions:
  _REGION: us-east1
  _REPO: charla
  _TAG: latest
  _PRESENTACION: espol
  _GOOGLE_CLIENT_ID: 20032347418-fqc802niqkatovc3pnhlcvnd5niicmib.apps.googleusercontent.com
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}
      - --build-arg=NEXT_PUBLIC_PRESENTACION=${_PRESENTACION}
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:${_TAG}
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
